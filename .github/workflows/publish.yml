name: Publish Digital Pathshala Resources

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'config/**'
      - 'tests/**'
      - 'docs/**'
      - 'scripts/**'
      - 'vault/**'
      - 'independent_source/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
  schedule:
    # Poll after the 11 AM IST Short; retry while the feed catches up.
    # GitHub scheduled executions are best effort, not precise to the minute.
    - cron: '7,22,37,52 11-23 * * *'
      timezone: "Asia/Kolkata"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digital-pathshala-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate publication safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Verify frontend and Apps Script JavaScript syntax
        run: |
          node --check site/assets/site.js
          node --check site/assets/independent.js
          node --check < backend/Code.gs
      - name: Test deployed Apps Script health (read only)
        continue-on-error: true
        run: python3 scripts/check_backend_health.py
      - name: Diagnose browser form confirmation without submitting data
        continue-on-error: true
        run: python3 scripts/diagnose_confirmation.py
      - name: One-time synthetic form submission and Sheet receipt test
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[form-e2e]')
        continue-on-error: true
        run: python3 scripts/test_form_e2e_once.py
      - name: One-time Short 01 form and Google Sheet integration test
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[short-form-e2e]')
        continue-on-error: true
        run: python3 scripts/test_short_form_e2e_once.py
      - name: Diagnose overdue video resources and public channel identity
        env:
          DP_VAULT_PASSPHRASE: ${{ secrets.DP_VAULT_PASSPHRASE }}
        run: python3 scripts/diagnose_video_release.py
      - name: Inspect public Shorts metadata (one-time RSS fallback probe)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[shorts-probe]')
        continue-on-error: true
        run: python3 scripts/inspect_public_shorts.py
      - name: Discover public Shorts without a YouTube API key
        run: python3 scripts/discover_shorts.py
      - name: Persist confirmed video links with optimistic concurrency
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = 'config/discovered.json';
            const local = JSON.parse(fs.readFileSync(path, 'utf8'));
            const updates = local.shorts || {};
            const owner = context.repo.owner, repo = context.repo.repo;
            if (!Object.keys(updates).length) return;
            for (let attempt = 0; attempt < 5; attempt++) {
              const response = await github.rest.repos.getContent({owner, repo, path, ref:'main'});
              const current = JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
              const merged = {...(current.shorts || {})};
              let changed = false;
              for (const [id, entry] of Object.entries(updates)) {
                if (merged[id]) {
                  if (merged[id].youtube_id !== entry.youtube_id)
                    throw new Error('Conflicting public video ID for '+id+'; withholding publication');
                } else {
                  merged[id] = entry;
                  changed = true;
                }
              }
              if (!changed) {
                core.info('Verified Shorts discovery ledger already up to date');
                return;
              }
              const serialized = JSON.stringify({...current,shorts:merged}, null, 2)+'\n';
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path, branch:'main',
                  message:'auto: record verified YouTube Shorts without stale-branch conflicts',
                  sha:response.data.sha,
                  content:Buffer.from(serialized,'utf8').toString('base64')
                });
                core.info('Saved verified public YouTube Shorts IDs: '+Object.keys(merged).length);
                return;
              } catch (err) {
                if (![409,422].includes(err.status) || attempt===4) throw err;
                core.warning('Concurrent repository update; retrying discovery ledger save');
                await new Promise(resolve=>setTimeout(resolve,250*(attempt+1)));
              }
            }
      - name: Prepare optional PDF cover and preview renderer
        shell: bash
        run: |
          if find independent_source -type f -iname '*.pdf' -print -quit | grep -q .; then
            if ! command -v pdftoppm >/dev/null 2>&1; then
              (sudo apt-get update -qq && sudo apt-get install -y poppler-utils) || echo 'Optional PDF previews unavailable; fallback cover will be used.'
            fi
          fi
      - name: Build verified released resources only
        env:
          DP_VAULT_PASSPHRASE: ${{ secrets.DP_VAULT_PASSPHRASE }}
        run: python3 scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Verify published website and original e-book PDF (read-only)
        run: python3 scripts/check_backend_health.py
